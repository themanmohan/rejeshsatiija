server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Contact / partners API — same container network as `api` service
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
    }

    # CMS slug for the Travel Bharat feature → its canonical page
    location = /magazines/featured-in-travel-bharat-indian-railways-premium-onboard-magazine {
        return 301 /magazines/travel-bharat-ai-healthcare-robotics-2026;
    }

    location / {
        # =404 (not /404.html) so missing pages return a real 404 status,
        # not a "soft 404" 200; error_page below still shows /404.html.
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    location ~* \.(?:jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Logos / branding / favicons — shorter cache so Google/crawlers pick updates
    location ~* ^/(brand-logo|logo|favicon|favicon-\d+|apple-touch-icon)\.(?:png|jpg|jpeg|svg|ico)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }
}
